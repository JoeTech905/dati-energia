on:
  schedule:
    # Esegue ogni giorno alle 21:30 ora italiana (19:30 UTC)
    - cron: '00 19 * * *'
  
  # Ti permette comunque di fare un test manuale quando vuoi dalla pagina di GitHub
  workflow_dispatch: 

jobs:
  aggiorna-dati:
    runs-on: ubuntu-latest
    steps:
      - name: Clona la repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa BeautifulSoup
        run: pip install beautifulsoup4

      - name: Esegui lo script di aggiornamento
        run: python aggiorna_energia_daily.py

      - name: Salva e aggiorna il file JSON nel repository
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Aggiornamento automatico PUN e PSV delle 21:30'
          add: 'dati_energia_daily.json'
