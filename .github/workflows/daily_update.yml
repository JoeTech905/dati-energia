name: Aggiorna Energia Daily

on:
  schedule:
    - cron: '0 8 * * *' # Si attiva ogni giorno alle 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-energia:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le librerie necessarie
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib yfinance

      - name: Esegui lo script di energia
        run: python aggiorna_energia_daily.py

      - name: Commit e push dei file aggiornati su GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add dati_energia_daily.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico dati energia [skip ci]"
          git push
